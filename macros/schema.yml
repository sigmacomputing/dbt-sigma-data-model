version: 2

macros:
  - name: model
    description: |
      Top-level Sigma data model. Assembles composed tables into a single page and resolves `relationships` into the real Sigma shape (nested under each relationship's source table, referencing the target table's real element id) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-relationship. `page.id` is left `''`, since Sigma assigns it on creation. Strips internal-only fields (`key`, `_column_ids`) from each table before emitting.
    arguments:
      - name: name
        type: string
        description: Sigma data model name.
      - name: tables
        type: list[any]
        description: List of `sigma_data_models.table(...)` specs that make up the data model's one page. Table `key`s must be unique within this call - a duplicate raises a compiler error, since `relationships` resolves `from`/`to` against them.
      - name: relationships
        type: list[any]
        description: List of `sigma_data_models.relationship(...)` specs, or bare `(from, from_column, to, to_column)` tuples. Default `[]`. Each `from`/`to` must reference a `key` present in `tables`, and each `from_column`/`to_column` must be an actual column on that table - all four raise a compiler error otherwise. The same `(from, from_column, to, to_column)` combination can't be passed twice; a duplicate raises a compiler error.
      - name: controls
        type: list[any]
        description: List of `sigma_data_models.control(...)` specs. Controls are page-level elements (siblings to table elements) that let Sigma workbook users filter data interactively. Each control's `targets` are resolved to real element/column ids here, since that requires the composed table context. Control names must be unique within a model; a duplicate raises a compiler error.
      - name: page_name
        type: string
        description: Name for the default page — the page that tables without an explicit `page=` land on. Defaults to `name`. Has no effect when every table in the model sets `page=` explicitly.
      - name: folder_id
        type: string
        description: Sigma folder id the data model document lives in. Defaults to the `sigma_folder_id` project var.
      - name: data_model_id
        type: string
        description: Existing Sigma data model id, for updating a previously-created model. No default - `none` (omitted) for a first-time create, where Sigma assigns one.
      - name: connection_tags
        type: list[dict[string,any]]
        description: |
          Version tags that swap the warehouse connection, e.g. one tag per region or environment. Each entry is a dict with `name` (required, unique within the model) and `connection_id` (required, the target Sigma connection id; `connectionId` is accepted too). An optional `paths` list overrides the source mapping: each path dict accepts `from_connection_id`, `from_path` and `to_path` (camelCase spellings are accepted too). `from_path` and `to_path` are lists of 1 to 3 non-empty strings - `[database]`, `[database, schema]` or `[database, schema, table]` - and must be set together; a `from_path` may appear only once per tag (per `from_connection_id`). Use `sigma_data_models.connection_tag_paths()` to generate table-level paths. Tags land in `meta.sigma_data_model_connection_tags` alongside `meta.sigma_data_model`; the spec itself is unchanged. A downstream sync tool uses these to call `POST /v2/dataModels/tag` with `sourceMappingConfig` after every spec update. Duplicate or empty names, a missing `connection_id`, conflicting spellings, malformed or duplicate paths, and a `from_connection_id` that doesn't match any table in the model all raise a compiler error. How overlapping paths (e.g. schema-level plus table-level) resolve is up to Sigma's tag API and is not checked here. Default `[]`.

  - name: connection_tag_paths
    description: |
      Maps each table's own `[database, schema, table]` source path to a table-level path on a tagged connection, for use in a `connection_tags` entry's `paths`. Returns a list of `{from_path, to_path}` dicts. Concatenate several calls to map different table groups to different databases or schemas.
    arguments:
      - name: tables
        type: list[dict[string,any]]
        description: Tables returned by `sigma_data_models.table(...)`.
      - name: to_database
        type: string
        description: Database to map to. Defaults to each table's own database.
      - name: to_schema
        type: string
        description: Schema to map to. Defaults to each table's own schema.

  - name: control
    description: |
      Normalizes a control into an intent descriptor; `sigma_data_models.model()` resolves each target in `targets` into the real Sigma filter shape (`{source: {kind: 'table', elementId}, columnId}`) once every table in the model has been composed. Controls are page-level elements - siblings to table elements in `pages[].elements[]`, not nested inside a table. The `controlId` in the emitted spec is set to `name`, which is the stable identifier used to reference this control in Sigma formulas. Additional control-type-specific fields (`mode`, `value`, etc.) are passed verbatim via `options={}`.
    arguments:
      - name: name
        type: string
        description: Control key, used as `controlId` in the emitted spec (the stable formula reference used in Sigma formulas to reference this control). Also used to freeze its id and (when no `display_name` is supplied) derive the display name via `titleize`. Must be unique within this model call — a duplicate raises a compiler error. Note that Sigma formula references to a control use `controlId` globally across the data model (and potentially across models in the same Sigma org), so reusing the same name on controls in different models may cause formula ambiguity in Sigma — choose names that are unique to the data model.
      - name: type
        type: string
        description: Sigma control type, passed verbatim as `controlType`, e.g. `'value-list'`, `'text'`, `'checkbox'`, `'switch'`, `'date-range'`, `'number-range'`.
      - name: targets
        type: list[any]
        description: One or more `(table_key, column_name)` tuples identifying the columns this control filters. Each `table_key` must be a key present in the model's `tables` list, and each `column_name` must be an actual column on that table - both raise a compiler error otherwise. Must be non-empty. Controls without an explicit `page=` inherit the page of their first target's table.
      - name: display_name
        type: string
        description: Sigma display name for the control element. Defaults to a title-cased version of `name`.
      - name: page
        type: string
        description: Name of the page this control should appear on. When omitted, the control inherits the page of its first target table (or the model default page if that table has no explicit page).
      - name: options
        type: dict[string,any]
        description: "Control-type-specific fields, passed through verbatim using Sigma's own field names, e.g. `{'mode': 'equals'}` for a text control. Default `{}`. Can't set `id`/`controlId`/`controlType`/`kind`/`filters` - those are already derived from `name`/`type`/`targets`, and `sigma_data_models.model()` raises a compiler error rather than letting `options` silently overwrite them."

  - name: table
    description: |
      A Sigma table element bound to a warehouse relation (`source.kind = 'warehouse-table'`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-single-table. Freezes the element id, and each of its columns'/metrics'/folders'/filters' ids, off `key` plus the table's physical `database.schema.identifier` (lowercased) together, so a self-join (the same physical table bound twice under different keys within one model) gets distinct ids per occurrence rather than colliding. Ids only need to be unique within one `sigma_data_models.model()` call (where `key` is already enforced unique), so the same `key` can still be reused freely across separate models. Use `page=` to assign this table to a named page within a multi-page model; omit it to land on the default page.
    arguments:
      - name: key
        type: string
        description: Local label for this table, used only to wire `relationships=[...]`/`folders=[...]` within the same `sigma_data_models.model()` call - it never appears in the emitted spec.
      - name: identifier
        type: string
        description: dbt model/relation name to bind to, and the default source table name used in auto-derived column formulas. Defaults to `key`.
      - name: database
        type: string
        description: Defaults to `target.database`.
      - name: schema
        type: string
        description: Defaults to `target.schema`.
      - name: connection_id
        type: string
        description: Sigma connection id for this table's `source`. Defaults to the `sigma_connection_id` project var. Required — raises a compiler error if neither is set.
      - name: columns
        type: list[any]
        description: Bare column name strings and/or `sigma_data_models.column(...)` specs. Left empty, columns are auto-populated as passthrough columns from the live relation via `adapter.get_columns_in_relation` (requires a connection - raises a clear compiler error under `dbt parse`, and also if the relation is found but has no columns, e.g. a nonexistent relation). Column names must be unique within a table; a duplicate raises a compiler error.
      - name: metrics
        type: any
        description: "Either a dict mapping metric name to formula, or a list of `sigma_data_models.metric(...)` specs. Metric names must be unique within a table; a duplicate raises a compiler error. Omitted entirely from the emitted table when empty, rather than an empty list."
      - name: folders
        type: list[any]
        description: List of `sigma_data_models.folder(...)` specs, grouping named subsets of `columns` and/or `metrics` for display - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-folder. Omitted entirely from the emitted table when empty. Folder names must be unique within a table; a duplicate raises a compiler error.
      - name: filters
        type: list[any]
        description: List of `sigma_data_models.filter(...)` specs. Omitted entirely from the emitted table when empty. A table can only have one filter per column/kind pair; a duplicate raises a compiler error.
      - name: display_name
        type: string
        description: Sigma display name for this table element. Defaults to a title-cased version of `key` (e.g. `'employees'` → `'Employees'`). Pass explicitly to override when the key's title-cased form isn't the desired label.
      - name: page
        type: string
        description: Name of the page this table should appear on within a multi-page model. Tables sharing the same `page=` value are grouped together; pages are emitted in first-appearance order across the `tables` list. Omit (or leave `none`) to place this table on the default page, named by `page_name` on `sigma_data_models.model()` (falling back to the model's `name`).

  - name: column
    description: |
      Normalizes a column into an intent descriptor; `sigma_data_models.table()` resolves it into the real Sigma column shape, since that requires table-level context (the identifier path for the id, the table's identifier for the default formula) this macro doesn't have. Leaving `formula` unset produces a passthrough column bound directly to the warehouse column (`{id, formula}`, no `name`); passing `formula` produces a calculated column (`{id, formula, name}`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-calculated-column. Adding `format` emits a `format` object on the element, controlling number/datetime display formatting - see https://help.sigmacomputing.com/docs/format-columns-and-metrics-in-the-code-representation-of-a-data-model.
    arguments:
      - name: name
        type: string
        description: Column key, used to freeze its id and (for a passthrough column) as the column referenced in the default formula. Lowercased regardless of input casing.
      - name: formula
        type: string
        description: Sigma formula, e.g. `\"[Price] - [Cost]\"`. Unset for a passthrough column, whose formula instead defaults to `'[<identifier>/<Titleized name>]'`.
      - name: display_name
        type: string
        description: Sigma display name for a calculated column. Defaults to a title-cased version of `name`. Ignored for a passthrough column, which has no `name` field.
      - name: format
        type: dict[string,any]
        description: "Display format for this column. Pass `sigma_data_models.format('number', {...})` or `sigma_data_models.format('datetime', {...})`, or a raw dict with at least a `kind` key set to `'number'` or `'datetime'`. Remaining fields (`formatString`, `decimalSymbol`, `digitGroupingSymbol`, `currencySymbol`, etc.) are passed through verbatim using Sigma's own field names. Omit (default `none`) to leave formatting at Sigma's default."

  - name: metric
    description: |
      Normalizes a metric into an intent descriptor; `sigma_data_models.table()` resolves it into the real Sigma metric shape (`{id, formula, name}`) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-metric. A plain dict entry (`{name: formula}`) in `sigma_data_models.table(metrics=...)` is sufficient when no `display_name` or `format` override is needed.
    arguments:
      - name: name
        type: string
        description: Metric key, used to freeze its id. Lowercased regardless of input casing.
      - name: formula
        type: string
        description: Sigma metric formula, e.g. `'CountDistinct([Account Guid])'`.
      - name: display_name
        type: string
        description: Sigma display name. Defaults to a title-cased version of `name`.
      - name: format
        type: dict[string,any]
        description: "Display format for this metric. Pass `sigma_data_models.format('number', {...})` or `sigma_data_models.format('datetime', {...})`, or a raw dict with at least a `kind` key set to `'number'` or `'datetime'`. Remaining fields are passed through verbatim. Omit (default `none`) to leave formatting at Sigma's default."

  - name: relationship
    description: |
      Normalizes a relationship into an intent descriptor; `sigma_data_models.model()` resolves it into the real Sigma shape (`{id, targetElementId, keys, name}`, nested inside the *source* table's element) once every table in the model has been composed - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-table-and-a-relationship. A bare `(from, from_column, to, to_column)` tuple is sufficient when no `name` override is needed. Note a Sigma relationship has no join type - it's a declared lineage link, not a row-blending join; Sigma's join concept (`source.kind = 'join'`) is a distinct element kind this package does not yet support.
    arguments:
      - name: from
        type: string
        description: Key of the source table (the one this relationship nests under).
      - name: from_column
        type: string
        description: Column name on the source table. Must be an actual column on that table, or `sigma_data_models.model()` raises a compiler error.
      - name: to
        type: string
        description: Key of the target table.
      - name: to_column
        type: string
        description: Column name on the target table. Must be an actual column on that table, or `sigma_data_models.model()` raises a compiler error.
      - name: name
        type: string
        description: Relationship display name. Defaults to `titleize(from) ~ ' → ' ~ titleize(to)`.

  - name: folder
    description: |
      Normalizes a folder into an intent descriptor; `sigma_data_models.table()` resolves the member `columns`/`metrics` (by name) into the real Sigma folder shape (`{id, name, items}`, where `items` is the member columns'/metrics' ids, columns first then metrics, each in declared order) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-a-folder. Each entry in `columns` must be an actual column, and each entry in `metrics` an actual metric, on the same table - either raises a compiler error otherwise.
    arguments:
      - name: name
        type: string
        description: Folder display name.
      - name: columns
        type: list[string]
        description: Column names to group under this folder.
      - name: metrics
        type: list[string]
        description: Metric names to group under this folder, alongside (or instead of) `columns`.

  - name: filter
    description: |
      Normalizes a filter into an intent descriptor; `sigma_data_models.table()` resolves the `column` (by name) into the real Sigma filter shape (`{id, columnId, kind, ...}`, where `...` is `options` passed through verbatim) - see https://help.sigmacomputing.com/docs/example-representation-data-model-with-filters. `options` uses Sigma's own field names directly (e.g. `min`/`max` for `kind='number-range'`, `mode`/`values` for `kind='list'`, `mode`/`value`/`case` for `kind='text-match'`, plus optionally `includeNulls` on any kind), so there's no per-`kind` macro surface to keep in sync with Sigma's filter types.
    arguments:
      - name: column
        type: string
        description: Column name this filter targets. Must be an actual column on the same table, or `sigma_data_models.table()` raises a compiler error.
      - name: kind
        type: string
        description: Sigma filter kind, e.g. `'number-range'`/`'list'`/`'text-match'`.
      - name: options
        type: dict[string,any]
        description: "Kind-specific fields, passed through verbatim using Sigma's own field names, e.g. `{'mode': 'include', 'values': ['Manufacturing']}`. Default `{}`. Can't set `id`/`columnId`/`kind` - those are already derived from `column`/`kind`, and `sigma_data_models.table()` raises a compiler error rather than letting `options` silently overwrite them."

  - name: format
    description: |
      Constructs a Sigma format object controlling number or datetime display formatting on a column or metric element - see https://help.sigmacomputing.com/docs/format-columns-and-metrics-in-the-code-representation-of-a-data-model. Validates that `kind` is one of `'number'` or `'datetime'` and merges `options` into the result. Pass the returned dict as `format=` to `sigma_data_models.column()` or `sigma_data_models.metric()`. A raw dict is also accepted there for callers who prefer to pass the Sigma format spec verbatim.
    arguments:
      - name: kind
        type: string
        description: "Format kind — must be `'number'` or `'datetime'`. Raises a compiler error otherwise."
      - name: options
        type: dict[string,any]
        description: "Format-specific fields using Sigma's own field names. Allowed keys are validated at compile time — unsupported keys raise a compiler error. For `kind='number'`: `formatString`, `decimalSymbol`, `digitGroupingSymbol`, `digitGroupingSize`, `currencySymbol`. For `kind='datetime'`: `formatString` only. Default `{}`."

  - name: materialize
    description: |
      Wires a composed `sigma_data_models.model(...)` spec into the dbt model's `config(meta=...)`, where it lands in `manifest.json` on `dbt parse`/`dbt compile`. When the spec carries `connection_tags`, also sets `meta.sigma_data_model_connection_tags`. Replaces `meta` wholesale rather than merging it - other `meta` keys set on the same model (directly or via `dbt_project.yml`) will be dropped.
    arguments:
      - name: spec
        type: dict[string,any]
        description: The dict returned by `sigma_data_models.model(...)`.
      - name: materialized
        type: string
        description: Materialization for the underlying (inert) model. Default `'view'`.

  - name: freeze_id
    description: |
      Returns `local_md5(path)` for a stable path string. Same path in, same id out, on every compile — the id only changes if the underlying path (a table's `key` plus `database.schema.identifier` for table/column/metric/folder/filter ids, or a relationship's `from`/`to`/`from_column`/`to_column`) is renamed. Used internally; not normally called directly.
    arguments:
      - name: path
        type: string
        description: Stable path string to hash, e.g. `'table:' ~ freeze_scope`.

  - name: titleize
    description: |
      Converts `snake_case`/`kebab-case` strings to a title-cased display string, e.g. `account_guid` -> `Account Guid`. Used internally to derive default `display_name`s and passthrough-column formulas; not normally called directly.
    arguments:
      - name: value
        type: string
        description: String to title-case.
